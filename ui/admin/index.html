<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bubble Splash · Admin</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            :root {
                --bg: #061325;
                --surface: rgba(15, 30, 60, 0.95);
                --border: rgba(255, 255, 255, 0.08);
                --text: #e2e8f0;
                --muted: rgba(255, 255, 255, 0.4);
                --green-glow: rgba(16, 185, 129, 0.25);
                --red-glow: rgba(239, 68, 68, 0.25);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 0;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                min-height: 100vh;
            }

            /* ---- LOGIN SCREEN ---- */
            #login-screen {
                position: fixed;
                inset: 0;
                background: var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                z-index: 1000;
            }

            #login-screen.hidden {
                display: none;
            }

            .login-card {
                width: 100%;
                max-width: 360px;
                background: linear-gradient(
                    145deg,
                    rgba(15, 30, 60, 0.98),
                    rgba(10, 20, 45, 0.99)
                );
                border: 1px solid rgba(147, 51, 234, 0.25);
                border-radius: 22px;
                padding: 36px 30px 30px;
                box-shadow:
                    0 24px 60px rgba(0, 0, 0, 0.5),
                    0 0 40px rgba(147, 51, 234, 0.06),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
                animation: card-enter 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)
                    both;
            }

            @keyframes card-enter {
                from {
                    opacity: 0;
                    transform: scale(0.88) translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }

            .login-logo {
                text-align: center;
                margin-bottom: 28px;
            }

            .login-logo-icon {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background:
                    radial-gradient(
                        circle at 30% 30%,
                        rgba(255, 255, 255, 0.7),
                        transparent 40%
                    ),
                    radial-gradient(
                        circle,
                        rgba(59, 130, 246, 0.5) 0%,
                        rgba(30, 58, 138, 0.4) 100%
                    );
                border: 1px solid rgba(255, 255, 255, 0.35);
                box-shadow:
                    0 4px 20px rgba(59, 130, 246, 0.3),
                    inset 2px 2px 8px rgba(255, 255, 255, 0.25);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 1.6rem;
                margin-bottom: 14px;
            }

            .login-title {
                font-size: 1.15rem;
                font-weight: 800;
                letter-spacing: 0.5px;
                background: linear-gradient(135deg, #93c5fd, #c084fc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin: 0 0 4px;
            }

            .login-subtitle {
                font-size: 0.78rem;
                color: var(--muted);
                margin: 0;
            }

            .login-field {
                margin-bottom: 16px;
            }

            .login-field label {
                display: block;
                font-size: 0.75rem;
                font-weight: 600;
                color: rgba(255, 255, 255, 0.6);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 7px;
            }

            .password-wrapper {
                position: relative;
            }

            .login-field input {
                width: 100%;
                padding: 12px 42px 12px 14px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                color: white;
                font-size: 1rem;
                font-family: inherit;
                outline: none;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }

            .login-field input:focus {
                border-color: rgba(147, 51, 234, 0.5);
                box-shadow: 0 0 16px rgba(147, 51, 234, 0.15);
            }

            .login-field input::placeholder {
                color: rgba(255, 255, 255, 0.2);
            }

            .toggle-pw {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--muted);
                cursor: pointer;
                padding: 0;
                font-size: 0.85rem;
                transition: color 0.2s;
            }
            .toggle-pw:hover {
                color: var(--text);
            }

            .login-error {
                font-size: 0.8rem;
                color: #f87171;
                min-height: 18px;
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .login-btn {
                width: 100%;
                padding: 13px;
                border: none;
                border-radius: 14px;
                font-size: 0.95rem;
                font-weight: 700;
                letter-spacing: 0.5px;
                cursor: pointer;
                color: white;
                background: linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.75),
                    rgba(147, 51, 234, 0.75)
                );
                box-shadow:
                    0 4px 15px rgba(147, 51, 234, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.15);
                transition:
                    box-shadow 0.2s,
                    transform 0.15s,
                    opacity 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .login-btn:hover {
                box-shadow:
                    0 6px 20px rgba(147, 51, 234, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
            .login-btn:active {
                transform: scale(0.97);
            }
            .login-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

            .btn-spinner {
                display: inline-block;
                width: 15px;
                height: 15px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .login-hint {
                text-align: center;
                margin-top: 16px;
                font-size: 0.72rem;
                color: rgba(255, 255, 255, 0.2);
                line-height: 1.5;
            }

            .shake {
                animation: shake 0.38s ease-in-out;
            }

            @keyframes shake {
                0%,
                100% {
                    transform: translateX(0);
                }
                15% {
                    transform: translateX(-7px);
                }
                30% {
                    transform: translateX(6px);
                }
                45% {
                    transform: translateX(-5px);
                }
                60% {
                    transform: translateX(4px);
                }
                75% {
                    transform: translateX(-2px);
                }
            }

            /* ---- ADMIN UI ---- */
            #admin-ui {
                display: none;
            }
            #admin-ui.visible {
                display: block;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 14px 24px;
                background: rgba(0, 0, 0, 0.25);
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 10;
                backdrop-filter: blur(12px);
            }

            .top-bar-left {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .top-bar-title {
                font-size: 1rem;
                font-weight: 800;
                letter-spacing: 1px;
                text-transform: uppercase;
                background: linear-gradient(135deg, #93c5fd, #c084fc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .top-bar-subtitle {
                font-size: 0.72rem;
                color: var(--muted);
                letter-spacing: 0.5px;
            }

            .top-bar-actions {
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .icon-btn {
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid var(--border);
                color: var(--text);
                width: 36px;
                height: 36px;
                border-radius: 10px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.85rem;
                transition:
                    background 0.2s,
                    box-shadow 0.2s;
                position: relative;
            }
            .icon-btn:hover {
                background: rgba(255, 255, 255, 0.12);
            }
            .icon-btn[title]:hover::after {
                content: attr(title);
                position: absolute;
                bottom: -30px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.75);
                color: white;
                padding: 3px 8px;
                border-radius: 6px;
                font-size: 0.7rem;
                white-space: nowrap;
                pointer-events: none;
            }
            .icon-btn.spinning i {
                animation: spin 0.8s linear infinite;
            }

            .filter-bar {
                display: flex;
                gap: 6px;
                padding: 16px 24px 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .filter-bar::-webkit-scrollbar {
                display: none;
            }

            .tab {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 7px 16px;
                border-radius: 20px;
                border: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.04);
                color: var(--muted);
                font-size: 0.82rem;
                font-weight: 600;
                cursor: pointer;
                white-space: nowrap;
                transition: all 0.18s;
                letter-spacing: 0.3px;
            }
            .tab:hover {
                background: rgba(255, 255, 255, 0.08);
                color: var(--text);
            }
            .tab.active {
                background: rgba(59, 130, 246, 0.15);
                border-color: rgba(59, 130, 246, 0.4);
                color: #93c5fd;
            }

            .tab-count {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                padding: 1px 7px;
                font-size: 0.72rem;
                font-weight: 700;
            }
            .tab.active .tab-count {
                background: rgba(59, 130, 246, 0.25);
            }

            .content {
                padding: 16px 24px 40px;
                max-width: 800px;
                margin: 0 auto;
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: var(--muted);
            }
            .empty-state i {
                font-size: 2.5rem;
                margin-bottom: 16px;
                display: block;
                opacity: 0.4;
            }
            .empty-state p {
                margin: 0;
                font-size: 0.9rem;
            }

            .suggestions-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .suggestion-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 18px 20px;
                animation: card-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: translateY(8px) scale(0.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .suggestion-card[data-status="pending"] {
                border-left: 3px solid #fbbf24;
            }
            .suggestion-card[data-status="approved"] {
                border-left: 3px solid #34d399;
            }
            .suggestion-card[data-status="rejected"] {
                border-left: 3px solid #f87171;
            }

            .card-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 10px;
            }

            .card-word {
                font-size: 1.4rem;
                font-weight: 800;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .status-badge {
                padding: 3px 10px;
                border-radius: 10px;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.8px;
                text-transform: uppercase;
                flex-shrink: 0;
            }
            .status-badge.pending {
                background: rgba(251, 191, 36, 0.15);
                color: #fbbf24;
                border: 1px solid rgba(251, 191, 36, 0.3);
            }
            .status-badge.approved {
                background: rgba(52, 211, 153, 0.15);
                color: #34d399;
                border: 1px solid rgba(52, 211, 153, 0.3);
            }
            .status-badge.rejected {
                background: rgba(248, 113, 113, 0.15);
                color: #f87171;
                border: 1px solid rgba(248, 113, 113, 0.3);
            }

            .card-reason {
                font-size: 0.87rem;
                color: rgba(255, 255, 255, 0.65);
                line-height: 1.5;
                margin-bottom: 12px;
                font-style: italic;
            }

            .card-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                font-size: 0.75rem;
                color: var(--muted);
                margin-bottom: 14px;
            }
            .card-meta span {
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .card-actions {
                display: flex;
                gap: 8px;
            }

            .action-btn {
                padding: 7px 18px;
                border-radius: 10px;
                border: none;
                font-size: 0.82rem;
                font-weight: 700;
                letter-spacing: 0.5px;
                cursor: pointer;
                transition:
                    transform 0.15s,
                    box-shadow 0.2s,
                    opacity 0.2s;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .action-btn:active {
                transform: scale(0.95);
            }
            .action-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
                transform: none;
            }

            .approve-btn {
                background: linear-gradient(
                    135deg,
                    rgba(16, 185, 129, 0.8),
                    rgba(5, 150, 105, 0.8)
                );
                color: white;
                box-shadow: 0 2px 10px var(--green-glow);
            }
            .approve-btn:hover:not(:disabled) {
                box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
            }

            .reject-btn {
                background: linear-gradient(
                    135deg,
                    rgba(239, 68, 68, 0.7),
                    rgba(185, 28, 28, 0.7)
                );
                color: white;
                box-shadow: 0 2px 10px var(--red-glow);
            }
            .reject-btn:hover:not(:disabled) {
                box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
            }

            .undo-btn {
                background: rgba(255, 255, 255, 0.07);
                color: var(--muted);
                border: 1px solid var(--border);
            }
            .undo-btn:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.12);
                color: var(--text);
            }

            .toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%) translateY(80px);
                padding: 11px 22px;
                border-radius: 12px;
                font-size: 0.88rem;
                font-weight: 600;
                color: white;
                z-index: 200;
                opacity: 0;
                transition:
                    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                    opacity 0.25s;
                pointer-events: none;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
                white-space: nowrap;
            }
            .toast.show {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
            .toast.success {
                background: linear-gradient(
                    135deg,
                    rgba(16, 185, 129, 0.95),
                    rgba(5, 150, 105, 0.95)
                );
                border: 1px solid rgba(52, 211, 153, 0.4);
            }
            .toast.error {
                background: linear-gradient(
                    135deg,
                    rgba(239, 68, 68, 0.95),
                    rgba(185, 28, 28, 0.95)
                );
                border: 1px solid rgba(252, 165, 165, 0.4);
            }
            .toast.info {
                background: linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.95),
                    rgba(29, 78, 216, 0.95)
                );
                border: 1px solid rgba(147, 197, 253, 0.4);
            }

            @media (max-width: 500px) {
                .content {
                    padding: 12px 14px 40px;
                }
                .top-bar {
                    padding: 12px 16px;
                }
                .filter-bar {
                    padding: 12px 14px 0;
                }
                .card-word {
                    font-size: 1.2rem;
                }
            }
        </style>
    </head>

    <body>
        <!-- ---- LOGIN SCREEN ---- -->
        <div id="login-screen">
            <div class="login-card" id="login-card">
                <div class="login-logo">
                    <div class="login-logo-icon">🫧</div>
                    <p class="login-title">Bubble Splash</p>
                    <p class="login-subtitle">Admin Access</p>
                </div>
                <form id="login-form" autocomplete="off">
                    <div class="login-field">
                        <label for="password-input">Password</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password-input"
                                placeholder="Enter admin password"
                                autofocus
                            />
                            <button
                                type="button"
                                class="toggle-pw"
                                id="toggle-pw"
                                tabindex="-1"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="login-error" id="login-error"></div>
                    <button type="submit" class="login-btn" id="login-btn">
                        Sign In
                    </button>
                </form>
                <p class="login-hint">
                    Password is set via <code>Admin:ApiKey</code> in
                    appsettings.Development.json
                </p>
            </div>
        </div>

        <!-- ---- ADMIN UI ---- -->
        <div id="admin-ui">
            <div class="top-bar">
                <div class="top-bar-left">
                    <div class="top-bar-title">Bubble Splash</div>
                    <div class="top-bar-subtitle">Word Suggestion Admin</div>
                </div>
                <div class="top-bar-actions">
                    <button class="icon-btn" id="refresh-btn" title="Refresh">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                    <button class="icon-btn" id="signout-btn" title="Sign out">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>

            <div class="filter-bar" id="filter-bar">
                <button class="tab" data-status="all">
                    All <span class="tab-count" id="count-all">0</span>
                </button>
                <button class="tab active" data-status="pending">
                    <i class="fas fa-clock" style="font-size: 0.75rem"></i>
                    Pending <span class="tab-count" id="count-pending">0</span>
                </button>
                <button class="tab" data-status="approved">
                    <i class="fas fa-check" style="font-size: 0.75rem"></i>
                    Approved
                    <span class="tab-count" id="count-approved">0</span>
                </button>
                <button class="tab" data-status="rejected">
                    <i class="fas fa-xmark" style="font-size: 0.75rem"></i>
                    Rejected
                    <span class="tab-count" id="count-rejected">0</span>
                </button>
            </div>

            <div class="content">
                <div id="suggestions-list" class="suggestions-list"></div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <script>
            const API_BASE = "http://10.0.0.90:5179/api/suggestions";
            const SESSION_KEY = "bws_admin_key";

            let allSuggestions = [];
            let activeFilter = "pending";
            let toastTimer;

            // --- AUTH HELPERS ---
            function getStoredKey() {
                return sessionStorage.getItem(SESSION_KEY) ?? "";
            }

            function authHeaders() {
                return {
                    "Content-Type": "application/json",
                    "X-Admin-Key": getStoredKey(),
                };
            }

            function signOut() {
                sessionStorage.removeItem(SESSION_KEY);
                document.getElementById("admin-ui").classList.remove("visible");
                document
                    .getElementById("login-screen")
                    .classList.remove("hidden");
                document.getElementById("password-input").value = "";
                document.getElementById("login-error").textContent = "";
                setTimeout(
                    () => document.getElementById("password-input").focus(),
                    50,
                );
            }

            // --- TOAST ---
            function showToast(msg, type = "info") {
                clearTimeout(toastTimer);
                const t = document.getElementById("toast");
                t.textContent = msg;
                t.className = `toast ${type}`;
                void t.offsetWidth;
                t.classList.add("show");
                toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
            }

            // --- LOGIN ---
            const loginForm = document.getElementById("login-form");
            const loginBtn = document.getElementById("login-btn");
            const loginErr = document.getElementById("login-error");
            const pwInput = document.getElementById("password-input");

            document
                .getElementById("toggle-pw")
                .addEventListener("click", () => {
                    const isHidden = pwInput.type === "password";
                    pwInput.type = isHidden ? "text" : "password";
                    document.querySelector("#toggle-pw i").className = isHidden
                        ? "fas fa-eye-slash"
                        : "fas fa-eye";
                });

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const key = pwInput.value;
                if (!key) return;

                loginBtn.disabled = true;
                loginBtn.innerHTML =
                    '<span class="btn-spinner"></span> Signing in…';
                loginErr.textContent = "";

                const ok = await tryAuth(key);

                if (ok) {
                    sessionStorage.setItem(SESSION_KEY, key);
                    showAdminUI();
                    fetchSuggestions();
                } else {
                    loginErr.innerHTML =
                        '<i class="fas fa-circle-exclamation"></i> Incorrect password';
                    const card = document.getElementById("login-card");
                    card.classList.remove("shake");
                    void card.offsetWidth;
                    card.classList.add("shake");
                    pwInput.select();
                    loginBtn.disabled = false;
                    loginBtn.textContent = "Sign In";
                }
            });

            async function tryAuth(key) {
                try {
                    const res = await fetch(`${API_BASE}?status=pending`, {
                        headers: { "X-Admin-Key": key },
                    });
                    return res.ok;
                } catch {
                    loginErr.innerHTML =
                        '<i class="fas fa-circle-exclamation"></i> Cannot reach API — is the server running?';
                    loginBtn.disabled = false;
                    loginBtn.textContent = "Sign In";
                    return false;
                }
            }

            function showAdminUI() {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("admin-ui").classList.add("visible");
            }

            document
                .getElementById("signout-btn")
                .addEventListener("click", signOut);

            // --- DATA FETCHING ---
            async function fetchSuggestions() {
                const btn = document.getElementById("refresh-btn");
                btn.classList.add("spinning");

                try {
                    const res = await fetch(API_BASE, {
                        headers: authHeaders(),
                    });

                    if (res.status === 401) {
                        signOut();
                        return;
                    }

                    if (!res.ok) throw new Error(`Server error ${res.status}`);
                    allSuggestions = await res.json();
                    updateCounts();
                    renderList();
                } catch (err) {
                    showToast(
                        "Failed to load suggestions — is the API running?",
                        "error",
                    );
                } finally {
                    btn.classList.remove("spinning");
                }
            }

            async function reviewSuggestion(id, action) {
                const card = document.querySelector(
                    `.suggestion-card[data-id="${id}"]`,
                );
                const btns = card ? card.querySelectorAll(".action-btn") : [];
                btns.forEach((b) => (b.disabled = true));

                try {
                    const res = await fetch(`${API_BASE}/${id}/${action}`, {
                        method: "POST",
                        headers: authHeaders(),
                    });

                    if (res.status === 401) {
                        signOut();
                        return;
                    }

                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.detail || `Error ${res.status}`);
                    }

                    const updated = await res.json();
                    const idx = allSuggestions.findIndex((s) => s.id === id);
                    if (idx !== -1) allSuggestions[idx] = updated;

                    updateCounts();

                    if (action === "approve") {
                        let msg = `Approved: "${updated.word}"`;
                        if (updated.addedToDictionary === true)
                            msg += " — added to dictionary";
                        else if (updated.addedToDictionary === false)
                            msg += " — already in dictionary";
                        else msg += " — could not update dictionary file";
                        showToast(msg, "success");
                    } else {
                        let msg = `Rejected: "${updated.word}"`;
                        if (updated.removedFromDictionary === true)
                            msg += " — removed from dictionary";
                        else if (updated.removedFromDictionary === false)
                            msg += " — word not found in dictionary";
                        // null means either pending→rejected (no dict action) or a file error; only show error if we expected removal
                        showToast(msg, "info");
                    }

                    if (card) {
                        card.style.transition = "opacity 0.2s, transform 0.2s";
                        card.style.opacity = "0";
                        card.style.transform = "scale(0.97)";
                        setTimeout(() => {
                            renderCard(updated, card);
                            card.style.opacity = "1";
                            card.style.transform = "";
                        }, 200);
                    }
                } catch (err) {
                    showToast(err.message, "error");
                    btns.forEach((b) => (b.disabled = false));
                }
            }

            // --- COUNTS ---
            function updateCounts() {
                const counts = {
                    all: allSuggestions.length,
                    pending: 0,
                    approved: 0,
                    rejected: 0,
                };
                allSuggestions.forEach((s) => {
                    const key = s.status.toLowerCase();
                    if (key in counts) counts[key]++;
                });
                document.getElementById("count-all").textContent = counts.all;
                document.getElementById("count-pending").textContent =
                    counts.pending;
                document.getElementById("count-approved").textContent =
                    counts.approved;
                document.getElementById("count-rejected").textContent =
                    counts.rejected;
            }

            // --- RENDERING ---
            function filtered() {
                if (activeFilter === "all") return allSuggestions;
                return allSuggestions.filter(
                    (s) => s.status.toLowerCase() === activeFilter,
                );
            }

            function renderList() {
                const list = document.getElementById("suggestions-list");
                list.innerHTML = "";

                const items = filtered();
                if (items.length === 0) {
                    list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No ${activeFilter === "all" ? "" : activeFilter + " "}suggestions</p>
                    </div>`;
                    return;
                }

                items.forEach((s, i) => {
                    const card = document.createElement("div");
                    card.className = "suggestion-card";
                    card.style.animationDelay = `${i * 0.04}s`;
                    renderCard(s, card);
                    list.appendChild(card);
                });
            }

            function renderCard(s, el) {
                const status = s.status.toLowerCase();
                el.dataset.id = s.id;
                el.dataset.status = status;

                const submitted = formatDate(s.createdAtUtc);
                const reviewed = s.reviewedAtUtc
                    ? formatDate(s.reviewedAtUtc)
                    : null;

                const reasonHtml = s.reason
                    ? `<div class="card-reason"><i class="fas fa-quote-left" style="opacity:0.4;margin-right:6px;font-size:0.75rem"></i>${escapeHtml(s.reason)}</div>`
                    : "";

                const metaItems = [
                    `<span><i class="fas fa-calendar-alt"></i> Submitted ${submitted}</span>`,
                    reviewed
                        ? `<span><i class="fas fa-gavel"></i> Reviewed ${reviewed}</span>`
                        : "",
                    s.submitterIp
                        ? `<span><i class="fas fa-network-wired"></i> ${escapeHtml(s.submitterIp)}</span>`
                        : "",
                ]
                    .filter(Boolean)
                    .join("");

                let actionsHtml = "";
                if (status === "pending") {
                    actionsHtml = `
                    <button class="action-btn approve-btn" onclick="reviewSuggestion(${s.id}, 'approve')">
                        <i class="fas fa-check"></i> Approve
                    </button>
                    <button class="action-btn reject-btn" onclick="reviewSuggestion(${s.id}, 'reject')">
                        <i class="fas fa-xmark"></i> Reject
                    </button>`;
                } else if (status === "approved") {
                    actionsHtml = `
                    <button class="action-btn undo-btn" onclick="reviewSuggestion(${s.id}, 'reject')">
                        <i class="fas fa-rotate-left"></i> Undo (Reject)
                    </button>`;
                } else if (status === "rejected") {
                    actionsHtml = `
                    <button class="action-btn undo-btn" onclick="reviewSuggestion(${s.id}, 'approve')">
                        <i class="fas fa-rotate-left"></i> Undo (Approve)
                    </button>`;
                }

                el.innerHTML = `
                <div class="card-top">
                    <div class="card-word">${escapeHtml(s.word)}</div>
                    <span class="status-badge ${status}">${s.status}</span>
                </div>
                ${reasonHtml}
                <div class="card-meta">${metaItems}</div>
                <div class="card-actions">${actionsHtml}</div>`;
            }

            // --- UTILITIES ---
            function formatDate(iso) {
                const d = new Date(iso);
                const diffMs = Date.now() - d;
                const diffMin = Math.floor(diffMs / 60000);
                const diffHr = Math.floor(diffMin / 60);
                const diffDay = Math.floor(diffHr / 24);

                if (diffMin < 1) return "just now";
                if (diffMin < 60) return `${diffMin}m ago`;
                if (diffHr < 24) return `${diffHr}h ago`;
                if (diffDay < 7) return `${diffDay}d ago`;
                return d.toLocaleDateString(undefined, {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                });
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            // --- FILTER TABS ---
            document
                .getElementById("filter-bar")
                .addEventListener("click", (e) => {
                    const tab = e.target.closest(".tab");
                    if (!tab) return;
                    document
                        .querySelectorAll(".tab")
                        .forEach((t) => t.classList.remove("active"));
                    tab.classList.add("active");
                    activeFilter = tab.dataset.status;
                    renderList();
                });

            document
                .getElementById("refresh-btn")
                .addEventListener("click", fetchSuggestions);

            // --- BOOT: try stored key, otherwise show login ---
            (async () => {
                const stored = getStoredKey();
                if (stored && (await tryAuth(stored))) {
                    showAdminUI();
                    fetchSuggestions();
                }
                // If no stored key or auth failed, login screen is already visible
            })();
        </script>
    </body>
</html>
